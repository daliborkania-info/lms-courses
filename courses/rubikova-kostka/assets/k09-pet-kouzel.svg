<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 468" width="640" height="468" font-family="system-ui, -apple-system, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker></defs><text x="320.0" y="28" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">5 kouzel = celá kostka (metoda vrstev)</text><rect x="14" y="46" width="612" height="72" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" /><text x="28" y="72" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">1. VÝTAH</text><text x="28" y="96" font-size="17" fill="#7c3aed" font-weight="700" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">R' D' R D</text><text x="612" y="72" font-size="13" fill="#64748b" font-weight="600" text-anchor="end">bílé rohy (K04) + otočení žlutých rohů (K08)</text><text x="612" y="96" font-size="12" fill="#64748b" font-weight="400" text-anchor="end">výtah jede, dokud pasažér nevystoupí</text><rect x="14" y="128" width="612" height="72" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" /><text x="28" y="154" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">2. DRUHÁ VRSTVA</text><text x="28" y="178" font-size="17" fill="#7c3aed" font-weight="700" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">U R U' R' U' F' U F</text><text x="612" y="154" font-size="13" fill="#64748b" font-weight="600" text-anchor="end">hrana doprostřed doprava (K05)</text><text x="612" y="178" font-size="12" fill="#64748b" font-weight="400" text-anchor="end">nahoru-pravá-zpátky-zpátky-zpátky-přední'-nahoru-přední</text><rect x="14" y="210" width="612" height="72" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" /><text x="28" y="236" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">3. ŽLUTÝ KŘÍŽ</text><text x="28" y="260" font-size="17" fill="#7c3aed" font-weight="700" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">F R U R' U' F'</text><text x="612" y="236" font-size="13" fill="#64748b" font-weight="600" text-anchor="end">tečka - L - čára - kříž (K06)</text><text x="612" y="260" font-size="12" fill="#64748b" font-weight="400" text-anchor="end">zalévání kytky: po každém zalití vyroste</text><rect x="14" y="292" width="612" height="72" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" /><text x="28" y="318" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">4. SUNE</text><text x="28" y="342" font-size="17" fill="#7c3aed" font-weight="700" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">R U R' U R U2 R'</text><text x="612" y="318" font-size="13" fill="#64748b" font-weight="600" text-anchor="end">žluté hrany na místa (K07)</text><text x="612" y="342" font-size="12" fill="#64748b" font-weight="400" text-anchor="end">sluníčko: točí hranami dokola</text><rect x="14" y="374" width="612" height="72" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" /><text x="28" y="400" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">5. KOLOTOČ</text><text x="28" y="424" font-size="17" fill="#7c3aed" font-weight="700" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">U R U' L' U R' U' L</text><text x="612" y="400" font-size="13" fill="#64748b" font-weight="600" text-anchor="end">žluté rohy na místa (K07)</text><text x="612" y="424" font-size="12" fill="#64748b" font-weight="400" text-anchor="end">tři rohy jedou kolotočem, jeden je doma</text></svg>