<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" width="620" height="400" font-family="system-ui, -apple-system, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker></defs><text x="310.0" y="28" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">Který prst dělá který tah</text><rect x="14" y="44" width="592" height="58" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" /><text x="30" y="80" font-size="18" fill="#7c3aed" font-weight="700" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">U / U'</text><text x="144" y="70" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start">ukazováček zezadu (flick)</text><text x="144" y="90" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">nejrychlejší tah na kostce</text><rect x="14" y="110" width="592" height="58" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" /><text x="30" y="146" font-size="18" fill="#7c3aed" font-weight="700" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">R / R'</text><text x="144" y="136" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start">zápěstí pravé ruky</text><text x="144" y="156" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">kostku drž levou, pravá točí</text><rect x="14" y="176" width="592" height="58" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" /><text x="30" y="212" font-size="18" fill="#7c3aed" font-weight="700" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">D / D'</text><text x="144" y="202" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start">prsteník zespodu</text><text x="144" y="222" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">bez přehmatávání</text><rect x="14" y="242" width="592" height="58" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" /><text x="30" y="278" font-size="18" fill="#7c3aed" font-weight="700" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">F</text><text x="144" y="268" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start">palec nebo ukazováček</text><text x="144" y="288" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">jediný tah, kde se sahá dopředu</text><rect x="14" y="314" width="592" height="66" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" /><text x="30" y="340" font-size="14" fill="#dc2626" font-weight="700" text-anchor="start">Zloději času:</text><text x="30" y="362" font-size="13" fill="#7f1d1d" font-weight="400" text-anchor="start">regrip (přehmátnutí) a rotace celé kostky - každý stojí víc než kterýkoli tah</text></svg>