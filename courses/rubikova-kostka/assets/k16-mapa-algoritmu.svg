<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="system-ui, -apple-system, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker></defs><text x="320.0" y="26" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">Cesta k full OLL/PLL: 2-3 algoritmy týdně, žádný sprint</text><rect x="20" y="50" width="180" height="120" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" /><text x="110.0" y="78" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle">MÁŠ: 2-look</text><text x="110.0" y="102" font-size="14" fill="#0f172a" font-weight="600" text-anchor="middle">10 OLL + 6 PLL</text><text x="110.0" y="124" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">= 16 algoritmů</text><text x="110.0" y="146" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">strop ~30-40 s</text><rect x="230" y="50" width="180" height="120" rx="10" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5" /><text x="320.0" y="78" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle">KROK 1: full PLL</text><text x="320.0" y="102" font-size="14" fill="#0f172a" font-weight="600" text-anchor="middle">21 algoritmů</text><text x="320.0" y="124" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">~2 měsíce</text><text x="320.0" y="146" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">největší zisk času</text><rect x="440" y="50" width="180" height="120" rx="10" fill="#fef9c3" stroke="#fde047" stroke-width="1.5" /><text x="530.0" y="78" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle">KROK 2: full OLL</text><text x="530.0" y="102" font-size="14" fill="#0f172a" font-weight="600" text-anchor="middle">57 algoritmů</text><text x="530.0" y="124" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">~6 měsíců</text><text x="530.0" y="146" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">po skupinách tvarů</text><line x1="203" y1="110" x2="227" y2="110" stroke="#111827" stroke-width="3" marker-end="url(#ah)" stroke-linecap="round"/><line x1="413" y1="110" x2="437" y2="110" stroke="#111827" stroke-width="3" marker-end="url(#ah)" stroke-linecap="round"/><text x="320.0" y="205" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">Pravidla: uč se SVŮJ algoritmus (vyber z variant na jperm.net), uč se skupiny podobných,</text><text x="320.0" y="225" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">nový alg = přidej do opakování (kartičky), starý nezapomínej</text></svg>