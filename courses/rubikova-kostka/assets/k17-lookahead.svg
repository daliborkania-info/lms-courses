<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" font-family="system-ui, -apple-system, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker></defs><text x="320.0" y="24" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">Kam mizí čas: pauzy, ne tahy</text><text x="120" y="69" font-size="13" fill="#0f172a" font-weight="700" text-anchor="end">Začátečník:</text><rect x="130" y="50" width="32" height="28" fill="#7c3aed" stroke="white" stroke-width="1"/><rect x="162" y="50" width="48" height="28" fill="#dc2626" stroke="white" stroke-width="1"/><rect x="210" y="50" width="64" height="28" fill="#7c3aed" stroke="white" stroke-width="1"/><rect x="274" y="50" width="64" height="28" fill="#dc2626" stroke="white" stroke-width="1"/><rect x="338" y="50" width="80" height="28" fill="#7c3aed" stroke="white" stroke-width="1"/><rect x="418" y="50" width="48" height="28" fill="#dc2626" stroke="white" stroke-width="1"/><rect x="466" y="50" width="48" height="28" fill="#7c3aed" stroke="white" stroke-width="1"/><rect x="514" y="50" width="32" height="28" fill="#dc2626" stroke="white" stroke-width="1"/><rect x="546" y="50" width="64" height="28" fill="#7c3aed" stroke="white" stroke-width="1"/><text x="618.0" y="69" font-size="13" fill="#64748b" font-weight="600" text-anchor="start">30 s</text><text x="120" y="119" font-size="13" fill="#0f172a" font-weight="700" text-anchor="end">S lookahead:</text><rect x="130" y="100" width="40" height="28" fill="#7c3aed" stroke="white" stroke-width="1"/><rect x="170" y="100" width="8" height="28" fill="#dc2626" stroke="white" stroke-width="1"/><rect x="178" y="100" width="72" height="28" fill="#7c3aed" stroke="white" stroke-width="1"/><rect x="250" y="100" width="8" height="28" fill="#dc2626" stroke="white" stroke-width="1"/><rect x="258" y="100" width="88" height="28" fill="#7c3aed" stroke="white" stroke-width="1"/><rect x="346" y="100" width="8" height="28" fill="#dc2626" stroke="white" stroke-width="1"/><rect x="354" y="100" width="64" height="28" fill="#7c3aed" stroke="white" stroke-width="1"/><text x="426.0" y="119" font-size="13" fill="#64748b" font-weight="600" text-anchor="start">18 s</text><rect x="130" y="150" width="16" height="14" fill="#7c3aed"/><text x="152" y="162" font-size="13" fill="#64748b" font-weight="400" text-anchor="start">tahy (fáze solvu)</text><rect x="300" y="150" width="16" height="14" fill="#dc2626"/><text x="322" y="162" font-size="13" fill="#64748b" font-weight="400" text-anchor="start">pauza = hledání, co dál</text><rect x="20" y="185" width="600" height="70" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" /><text x="36" y="210" font-size="13" fill="#14532d" font-weight="600" text-anchor="start">Drill: pomalé solvy - toč pomalu a NIKDY nezastav. Oči hledají další pár,</text><text x="36" y="232" font-size="13" fill="#14532d" font-weight="600" text-anchor="start">zatímco ruce dodělávají ten současný. Cross+1: v inspekci naplánuj kříž + první pár.</text></svg>