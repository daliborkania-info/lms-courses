<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 288" width="640" height="288" font-family="system-ui, -apple-system, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker></defs><text x="320.0" y="24" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">CFOP není jediná cesta</text><rect x="20" y="46" width="180" height="130" rx="10" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5" /><text x="110" y="76" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle">CFOP</text><text x="110" y="100" font-size="13" fill="#7c3aed" font-weight="600" text-anchor="middle">tvoje metoda</text><text x="110" y="128" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">algoritmy + rychlé prsty,</text><text x="110" y="146" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">jede na ní většina špičky</text><rect x="230" y="46" width="180" height="130" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" /><text x="320" y="76" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle">Roux</text><text x="320" y="100" font-size="13" fill="#7c3aed" font-weight="600" text-anchor="middle">bloky + M tahy</text><text x="320" y="128" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">míň tahů, víc intuice,</text><text x="320" y="146" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">skvělá pro one-handed</text><rect x="440" y="46" width="180" height="130" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" /><text x="530" y="76" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle">ZZ</text><text x="530" y="100" font-size="13" fill="#7c3aed" font-weight="600" text-anchor="middle">orientace hran předem</text><text x="530" y="128" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">pak už žádné rotace,</text><text x="530" y="146" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle">plánovací metoda</text><rect x="20" y="196" width="600" height="76" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" /><text x="36" y="222" font-size="13" fill="#0c4a6e" font-weight="600" text-anchor="start">Blindfolded (BLD): kostka poslepu = paměťová disciplína (letter pairs, memory palace).</text><text x="36" y="244" font-size="13" fill="#0c4a6e" font-weight="600" text-anchor="start">WCA soutěže: 15 s inspekce, average of 5, nikdo se ti smát nebude - přijď.</text></svg>